name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEON_AUTH_BASE_URL: https://ci-placeholder.neonauth.example.com
      NEON_AUTH_COOKIE_SECRET: ci-placeholder-cookie-secret-32-characters-long
      NEON_DATA_API_URL: https://ci-placeholder-data-api.example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  # Runs only when GitHub Secrets for a disposable Neon test branch are
  # configured — see README.md. Never applies migrations to a production
  # branch (there is no automatic migration-apply step in this workflow at
  # all), and no connection string or secret value is ever printed.
  db-security-tests:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: secrets.NEON_TEST_DATABASE_URL != ''

    env:
      DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: SQL security tests (live Neon structural/security audit only)
        run: npm run test:db:security

  # Runs only when a real Neon development branch (Neon Auth + Data API
  # enabled) and real test accounts are configured as repository/
  # environment secrets — see README.md for the full list. Never made
  # required for the main job above, and no secret value is ever written
  # into this file.
  auth-e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: >
      secrets.E2E_NEON_AUTH_BASE_URL != '' &&
      secrets.E2E_NEON_DATA_API_URL != '' &&
      secrets.E2E_EMPLOYEE_EMAIL != '' &&
      secrets.E2E_EMPLOYEE_PASSWORD != '' &&
      secrets.E2E_ADMIN_EMAIL != '' &&
      secrets.E2E_ADMIN_PASSWORD != ''

    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEON_AUTH_BASE_URL: ${{ secrets.E2E_NEON_AUTH_BASE_URL }}
      NEON_AUTH_COOKIE_SECRET: ${{ secrets.E2E_NEON_AUTH_COOKIE_SECRET }}
      NEON_DATA_API_URL: ${{ secrets.E2E_NEON_DATA_API_URL }}
      E2E_EMPLOYEE_EMAIL: ${{ secrets.E2E_EMPLOYEE_EMAIL }}
      E2E_EMPLOYEE_PASSWORD: ${{ secrets.E2E_EMPLOYEE_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Real Neon Auth E2E
        run: npm run test:e2e:auth

  # Same gating as auth-e2e — this suite additionally exercises the
  # employee ticket cabinet (create/list/comment/cancel) end to end. All
  # ticket data it creates is prefixed `E2E:`; it never resets the database
  # and never changes the Admin account's role.
  employee-e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: >
      secrets.E2E_NEON_AUTH_BASE_URL != '' &&
      secrets.E2E_NEON_DATA_API_URL != '' &&
      secrets.E2E_EMPLOYEE_EMAIL != '' &&
      secrets.E2E_EMPLOYEE_PASSWORD != ''

    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEON_AUTH_BASE_URL: ${{ secrets.E2E_NEON_AUTH_BASE_URL }}
      NEON_AUTH_COOKIE_SECRET: ${{ secrets.E2E_NEON_AUTH_COOKIE_SECRET }}
      NEON_DATA_API_URL: ${{ secrets.E2E_NEON_DATA_API_URL }}
      E2E_EMPLOYEE_EMAIL: ${{ secrets.E2E_EMPLOYEE_EMAIL }}
      E2E_EMPLOYEE_PASSWORD: ${{ secrets.E2E_EMPLOYEE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Real Neon employee ticket workflow E2E
        run: npm run test:e2e:employee
